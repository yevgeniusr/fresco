services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fresco
      POSTGRES_USER: fresco
      POSTGRES_PASSWORD: fresco
    ports:
      - "5434:5432"
    volumes:
      - fresco_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fresco -d fresco"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  fresco_postgres:
